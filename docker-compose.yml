services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: edts_tickets
      POSTGRES_USER: edts
      POSTGRES_PASSWORD: edts
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edts -d edts_tickets"]
      interval: 5s
      timeout: 3s
      retries: 20

